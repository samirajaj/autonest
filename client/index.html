<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#090b0f" />
    <script>
      (() => {
        const saved = localStorage.getItem("autonest_theme");
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta
      name="description"
      content="AutoNest — discover, rent and buy exceptional cars."
    />
    <link rel="canonical" href="https://autonest-website.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AutoNest" />
    <meta property="og:title" content="AutoNest — Discover. Rent. Buy." />
    <meta
      property="og:description"
      content="Discover, rent and buy exceptional cars with AutoNest."
    />
    <meta property="og:url" content="https://autonest-website.vercel.app/" />
    <meta
      property="og:image"
      content="https://autonest-website.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AutoNest — Discover. Rent. Buy." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AutoNest — Discover. Rent. Buy." />
    <meta
      name="twitter:description"
      content="Discover, rent and buy exceptional cars with AutoNest."
    />
    <meta
      name="twitter:image"
      content="https://autonest-website.vercel.app/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="AutoNest — Discover. Rent. Buy."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AutoNest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
